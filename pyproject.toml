[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-record-kb"
version = "5.0.0"
description = "Minimal single-writer record knowledge base"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cortex = "cortex.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

